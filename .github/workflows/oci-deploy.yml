name: Build and deploy ClashInfoBot to OCI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: vars.OCI_GITOPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m pip install pip-audit bandit
      # aiogram currently requires aiohttp<3.14; the API is private and aiohttp
      # is used only for outbound calls. Remove when aiogram becomes compatible.
      - run: pip-audit . --ignore-vuln CVE-2026-34993 --ignore-vuln CVE-2026-47265
      - run: bandit -q -r app -x app/tests -s B104
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ghcr.io/zimovnov/clash-of-clans-raid-bot:${{ github.sha }}
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - run: |
          install -m 600 /dev/null /tmp/oci_key
          printf '%s' "${{ secrets.OCI_SSH_PRIVATE_KEY }}" > /tmp/oci_key
          ssh -o StrictHostKeyChecking=accept-new -i /tmp/oci_key ubuntu@${{ secrets.OCI_TAILSCALE_IP }} \
            "/opt/three-bots/scripts/deploy-service.sh clashinfo 'ghcr.io/zimovnov/clash-of-clans-raid-bot@${{ steps.build.outputs.digest }}'"
